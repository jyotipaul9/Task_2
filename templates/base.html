<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TaskFlow{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        /* Navbar */
        nav {
            background: #4f46e5;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav ul li a:hover {
            color: #dbeafe;
        }

        /* Main container */
        .container {
            width: 84%;
            max-width: 1100px;
            margin: auto;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
        }

        .btn:hover {
            background: #3730a3;
        }

        /* Hero */
        .hero {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 20px;
            color: #1e1b4b;
        }

        .hero h1 span {
            color: #4f46e5;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.7;
            color: #666;
        }

        .hero-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .hero-card .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        /* Section */
        .section {
            padding: 60px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 32px;
            color: #1e1b4b;
        }

        .section-title p {
            color: #777;
            margin-top: 10px;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .card .icon {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .card p {
            color: #666;
            line-height: 1.6;
        }

        /* Contact form */
        .contact-box {
            background: white;
            max-width: 650px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .submit-btn {
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        /* Footer */
        footer {
            margin-top: 50px;
            background: #1e1b4b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* Responsive */
        @media(max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 12px;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                padding: 50px 0;
            }

            .hero h1 {
                font-size: 38px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">TaskFlow</div>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about/">About</a></li>
            <li><a href="/tasks/">Tasks</a></li>
            <li><a href="/contact/">Contact</a></li>
        </ul>
    </nav>


    {% block content %}
    {% endblock %}


    <footer>
        <p>© 2026 TaskFlow | Django Mini Project</p>
    </footer>

</body>

</html>
