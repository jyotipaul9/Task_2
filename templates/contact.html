{% extends 'base.html' %}

{% block title %}Contact | TaskFlow{% endblock %}

{% block content %}

<div class="container">

    <section class="section">

        <div class="section-title">

            <h2>Contact Us</h2>

            <p>Have a question? Send us a message.</p>

        </div>


        <div class="contact-box">

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label>Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Message</label>

                    <textarea
                        name="message"
                        placeholder="Write your message..."
                        required
                    ></textarea>

                </div>


                <button type="submit" class="btn submit-btn">
                    Send Message
                </button>

            </form>

        </div>

    </section>

</div>

{% endblock %}
